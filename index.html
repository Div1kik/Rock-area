<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Лабораторный планиметр керна</title>
    <script src="cordova.js"></script>
    <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="onOpenCvReady();" type="text/javascript"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --bg-base: #0b0f19;
            --bg-surface: #131c2e;
            --bg-card: rgba(22, 33, 54, 0.88);
            --card-border: rgba(148, 163, 184, 0.12);
            --accent-mint: #10b981;
            --accent-mint-glow: rgba(16, 185, 129, 0.25);
            --accent-cyan: #06b6d4;
            --accent-blue: #3b82f6;
            --accent-red: #ef4444;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: radial-gradient(circle at top, #131e33 0%, var(--bg-base) 100%);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px 14px 44px;
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }

        header {
            width: 100%;
            max-width: 360px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .app-brand {
            font-size: 1.15rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -0.3px;
        }

        .header-btn {
            background: #1e293b;
            border: 1px solid var(--card-border);
            color: #f1f5f9;
            padding: 7px 12px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .view-wrapper {
            position: relative;
            width: 100%;
            max-width: 360px;
            aspect-ratio: 1 / 1;
            border-radius: 22px;
            overflow: hidden;
            background: #020617;
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.55), 0 0 0 1px var(--card-border);
            touch-action: none;
        }

        video, canvas { width: 100%; height: 100%; object-fit: cover; }

        #manual-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: auto;
            z-index: 15;
            display: none;
        }

        .zoom-loupe {
            position: absolute;
            top: 14px;
            left: 14px;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 3px solid var(--accent-cyan);
            box-shadow: 0 8px 24px rgba(0,0,0,0.7), 0 0 16px rgba(6, 182, 212, 0.4);
            overflow: hidden;
            background: #000;
            z-index: 30;
            display: none;
            pointer-events: none;
        }
        .zoom-loupe canvas { width: 100%; height: 100%; }

        .reticle-corners {
            position: absolute;
            inset: 22px;
            pointer-events: none;
            border: 2px dashed rgba(148, 163, 184, 0.25);
            border-radius: 14px;
            z-index: 5;
        }

        .focus-indicator {
            position: absolute;
            width: 50px;
            height: 50px;
            border: 2px solid var(--accent-cyan);
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
            transform: translate(-50%, -50%) scale(1.4);
            transition: opacity 0.2s, transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 25;
            box-shadow: 0 0 14px rgba(6, 182, 212, 0.45);
        }

        .status-badge {
            position: absolute;
            top: 14px;
            left: 14px;
            padding: 6px 12px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 600;
            background: rgba(11, 15, 25, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid var(--card-border);
            color: #f59e0b;
            display: flex;
            align-items: center;
            gap: 6px;
            z-index: 10;
        }
        .status-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

        .gyro-widget {
            position: absolute;
            top: 14px;
            right: 14px;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: rgba(11, 15, 25, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        .gyro-target { position: absolute; width: 14px; height: 14px; border-radius: 50%; border: 1px dashed rgba(255,255,255,0.3); }
        .gyro-bubble { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: #f59e0b; box-shadow: 0 0 8px #f59e0b; transition: transform 0.05s linear; }
        .gyro-label { position: absolute; bottom: -17px; font-size: 9px; font-weight: 600; color: var(--text-secondary); }

        .container {
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 14px;
        }

        .result-card {
            background: var(--bg-card);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 16px;
            text-align: center;
            backdrop-filter: blur(14px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
        }
        .result-label { font-size: 11px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.8px; }
        .result-val-wrap { display: flex; align-items: baseline; justify-content: center; gap: 6px; margin: 4px 0; }
        .result-val {
            font-size: 2.6rem;
            color: var(--accent-mint);
            font-weight: 800;
            letter-spacing: -1px;
            font-feature-settings: "tnum";
            text-shadow: 0 0 24px var(--accent-mint-glow);
        }
        .result-unit { font-size: 1.15rem; color: var(--accent-mint); font-weight: 600; }
        .info-msg { font-size: 12px; color: var(--text-secondary); }

        .mode-toggle-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            background: #0f172a;
            padding: 5px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
        }
        .mode-toggle-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 9px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 9px;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .mode-toggle-btn.active {
            background: var(--accent-blue);
            color: #fff;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.35);
        }

        .panel-box {
            background: var(--bg-card);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            backdrop-filter: blur(14px);
        }

        .slider-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-secondary); font-weight: 500; }
        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #1e293b;
            accent-color: var(--accent-cyan);
            outline: none;
        }

        .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #fff;
            border: none;
            padding: 13px 14px;
            font-size: 13.5px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.12s ease, opacity 0.12s ease;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
            user-select: none;
        }
        .btn:active:not(:disabled) { transform: scale(0.97); }
        .btn:disabled { background: #1e293b; color: #475569; box-shadow: none; cursor: not-allowed; opacity: 0.6; }
        .btn-secondary {
            background: #1e293b;
            border: 1px solid var(--card-border);
            color: #f1f5f9;
            box-shadow: none;
        }
        .btn-green {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #fff;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
        }
        .btn-red {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: var(--accent-red);
            padding: 6px 10px;
            font-size: 12px;
            border-radius: 8px;
            cursor: pointer;
        }

        .zoom-controls-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .input-group { display: flex; flex-direction: column; gap: 5px; }
        .input-label { font-size: 10.5px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }

        select, .input-text {
            background: #0f172a;
            border: 1px solid var(--card-border);
            color: #f8fafc;
            padding: 10px;
            border-radius: 10px;
            font-size: 13px;
            outline: none;
            width: 100%;
        }
        select:focus, .input-text:focus { border-color: var(--accent-cyan); }

        .archive-modal {
            position: fixed;
            inset: 0;
            background: rgba(11, 15, 25, 0.95);
            backdrop-filter: blur(18px);
            z-index: 100;
            display: none;
            flex-direction: column;
            padding: 16px 14px 24px;
            overflow-y: auto;
        }
        .archive-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
        .archive-title { font-size: 1.25rem; font-weight: 700; }
        .archive-filter-card {
            background: var(--bg-card);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 14px;
        }
        .filter-dates { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .archive-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .archive-item {
            background: var(--bg-card);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .item-info { display: flex; flex-direction: column; gap: 3px; }
        .item-name { font-size: 14px; font-weight: 700; }
        .item-meta { font-size: 11.5px; color: var(--text-secondary); }
        .item-area { font-size: 15px; font-weight: 800; color: var(--accent-mint); margin-top: 2px; }
        .item-actions { display: flex; align-items: center; gap: 6px; }
        .item-btn {
            background: #1e293b;
            border: 1px solid var(--card-border);
            color: #f1f5f9;
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .photo-viewer {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 200;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .viewer-img { max-width: 90vw; max-height: 65vh; border-radius: 12px; border: 1px solid var(--card-border); object-fit: contain; }
        .viewer-controls { margin-top: 14px; display: flex; gap: 10px; }
    </style>
</head>
<body>

    <header>
        <div class="app-brand">
            <span>📐</span>
            <span>Rock Area Core</span>
        </div>
        <button class="header-btn" id="open-archive-btn">
            <span>📁</span> Архив (<span id="header-archive-count">0</span>)
        </button>
    </header>

    <div class="view-wrapper" id="view-wrapper">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="output-canvas" style="display: none;"></canvas>
        <canvas id="manual-canvas"></canvas>
        
        <div class="zoom-loupe" id="zoom-loupe">
            <canvas id="loupe-canvas" width="90" height="90"></canvas>
        </div>

        <div class="reticle-corners"></div>
        <div class="focus-indicator" id="focus-indicator"></div>

        <div class="status-badge" id="status-badge">
            <span class="status-dot"></span>
            <span id="status-text">Инициализация CV...</span>
        </div>

        <div class="gyro-widget" id="gyro-box">
            <div class="gyro-target"></div>
            <div class="gyro-bubble" id="gyro-bubble"></div>
            <span class="gyro-label" id="gyro-label">0°</span>
        </div>
    </div>

    <div class="container">
        <div class="result-card">
            <div class="result-label">Площадь скола</div>
            <div class="result-val-wrap">
                <span class="result-val" id="area-display">0.00</span>
                <span class="result-unit">см²</span>
            </div>
            <div class="info-msg" id="info-display">Нажмите на область для ручной фокусировки</div>
        </div>

        <div class="mode-toggle-group" id="contour-mode-group" style="display: none;">
            <button class="mode-toggle-btn active" id="mode-auto-btn">⚡ Автопорог</button>
            <button class="mode-toggle-btn" id="mode-manual-btn">✏️ Ручное лассо</button>
        </div>

        <div class="panel-box" id="threshold-box">
            <div class="slider-row">
                <span>Порог отсечения фона</span>
                <span id="thresh-val" style="color: var(--accent-cyan); font-weight: 600;">Авто</span>
            </div>
            <input type="range" id="thresh-slider" min="30" max="220" value="110">
        </div>

        <div class="zoom-controls-row" id="manual-zoom-tools" style="display: none;">
            <button class="btn btn-secondary" id="zoom-in-btn" style="flex: 1;">🔍 Увеличить (+)</button>
            <button class="btn btn-secondary" id="zoom-out-btn" style="flex: 1;">🔍 Уменьшить (-)</button>
            <button class="btn btn-secondary" id="zoom-reset-btn" style="flex: 1;">1:1 Сброс</button>
        </div>

        <button class="btn btn-secondary" id="clear-manual-btn" style="display: none; width: 100%;">
            <span>🧹</span> Сбросить контур лассо
        </button>

        <div class="btn-row" id="main-btns-row">
            <button class="btn" id="capture-btn" disabled>
                <span>📷</span> С камеры
            </button>
            <button class="btn btn-secondary" id="gallery-btn" disabled>
                <span>📁</span> Из галереи
            </button>
        </div>
        
        <input type="file" id="file-input" accept="image/*" style="display: none;">
        <button class="btn btn-secondary" id="reset-btn" style="display: none;">🔄 Новый замер</button>

        <div class="panel-box">
            <div class="settings-grid">
                <div class="input-group">
                    <label class="input-label" for="target-mode">Тип калибровки:</label>
                    <select id="target-mode">
                        <option value="frame" selected>Сплошная рамка</option>
                        <option value="dots">4 угловых маркера</option>
                    </select>
                </div>
                <div class="input-group">
                    <label class="input-label" for="frame-size-input">Сторона базы, мм:</label>
                    <input type="number" id="frame-size-input" class="input-text" value="100" min="20" max="1000" step="5">
                </div>
            </div>
        </div>

        <div id="save-panel" class="panel-box" style="display: none;">
            <div class="input-group">
                <label class="input-label" for="sample-name">Шифр керна / образца:</label>
                <input type="text" id="sample-name" class="input-text" placeholder="Керн-1">
            </div>
            <button class="btn btn-green" id="save-record-btn">📥 Записать в архив</button>
        </div>
    </div>

    <!-- Полноэкранный Архив замеров -->
    <div class="archive-modal" id="archive-modal">
        <div class="archive-header">
            <div class="archive-title">📁 Архив замеров</div>
            <button class="header-btn" id="close-archive-btn">✕ Закрыть</button>
        </div>

        <div class="archive-filter-card">
            <div class="filter-dates">
                <div class="input-group">
                    <label class="input-label" for="filter-date-from">Дата С:</label>
                    <input type="date" id="filter-date-from" class="input-text">
                </div>
                <div class="input-group">
                    <label class="input-label" for="filter-date-to">Дата ПО:</label>
                    <input type="date" id="filter-date-to" class="input-text">
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                <button class="btn btn-green" id="export-excel-period-btn">
                    <span>💾</span> Скачать CSV
                </button>
                <button class="btn btn-secondary" id="export-zip-period-btn">
                    <span>📦</span> Фотоархив ZIP
                </button>
            </div>
            <button class="btn btn-secondary" id="export-html-report-btn" style="width: 100%; margin-top: 4px;">
                <span>📄</span> Фотопротокол (HTML / PDF)
            </button>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <span style="font-size: 12px; color: var(--text-secondary); text-transform: uppercase;">
                Найдено замеров: <b id="filtered-count" style="color: var(--accent-mint);">0</b>
            </span>
            <button class="btn-red" id="clear-all-archive-btn" style="padding: 4px 8px; font-size: 11px;">Очистить всё</button>
        </div>

        <div class="archive-list" id="archive-list-container"></div>
    </div>

    <!-- Просмотр фото образца -->
    <div class="photo-viewer" id="photo-viewer">
        <img id="viewer-img-el" class="viewer-img" src="" alt="Фото скола">
        <div class="viewer-controls">
            <button class="header-btn" id="toggle-photo-mode-btn">Показать маску</button>
            <button class="header-btn" id="close-viewer-btn">Закрыть</button>
        </div>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const viewWrapper = document.getElementById('view-wrapper');
        const focusIndicator = document.getElementById('focus-indicator');
        const outputCanvas = document.getElementById('output-canvas');
        const manualCanvas = document.getElementById('manual-canvas');
        const manualCtx = manualCanvas.getContext('2d');

        const zoomLoupe = document.getElementById('zoom-loupe');
        const loupeCanvas = document.getElementById('loupe-canvas');
        const loupeCtx = loupeCanvas.getContext('2d');

        const captureBtn = document.getElementById('capture-btn');
        const galleryBtn = document.getElementById('gallery-btn');
        const resetBtn = document.getElementById('reset-btn');
        const mainBtnsRow = document.getElementById('main-btns-row');
        const fileInput = document.getElementById('file-input');

        const contourModeGroup = document.getElementById('contour-mode-group');
        const modeAutoBtn = document.getElementById('mode-auto-btn');
        const modeManualBtn = document.getElementById('mode-manual-btn');
        const thresholdBox = document.getElementById('threshold-box');
        const clearManualBtn = document.getElementById('clear-manual-btn');
        const manualZoomTools = document.getElementById('manual-zoom-tools');
        const zoomInBtn = document.getElementById('zoom-in-btn');
        const zoomOutBtn = document.getElementById('zoom-out-btn');
        const zoomResetBtn = document.getElementById('zoom-reset-btn');

        const targetMode = document.getElementById('target-mode');
        const frameSizeInput = document.getElementById('frame-size-input');

        const savePanel = document.getElementById('save-panel');
        const saveRecordBtn = document.getElementById('save-record-btn');
        const sampleNameInput = document.getElementById('sample-name');
        const statusBadge = document.getElementById('status-badge');
        const statusText = document.getElementById('status-text');
        const threshSlider = document.getElementById('thresh-slider');
        const threshVal = document.getElementById('thresh-val');
        const areaDisplay = document.getElementById('area-display');
        const infoDisplay = document.getElementById('info-display');

        const gyroBox = document.getElementById('gyro-box');
        const gyroBubble = document.getElementById('gyro-bubble');
        const gyroLabel = document.getElementById('gyro-label');

        const openArchiveBtn = document.getElementById('open-archive-btn');
        const closeArchiveBtn = document.getElementById('close-archive-btn');
        const archiveModal = document.getElementById('archive-modal');
        const headerArchiveCount = document.getElementById('header-archive-count');
        const filterDateFrom = document.getElementById('filter-date-from');
        const filterDateTo = document.getElementById('filter-date-to');
        const exportExcelPeriodBtn = document.getElementById('export-excel-period-btn');
        const exportZipPeriodBtn = document.getElementById('export-zip-period-btn');
        const exportHtmlReportBtn = document.getElementById('export-html-report-btn');
        const archiveListContainer = document.getElementById('archive-list-container');
        const filteredCount = document.getElementById('filtered-count');
        const clearAllArchiveBtn = document.getElementById('clear-all-archive-btn');

        const photoViewer = document.getElementById('photo-viewer');
        const viewerImgEl = document.getElementById('viewer-img-el');
        const togglePhotoModeBtn = document.getElementById('toggle-photo-mode-btn');
        const closeViewerBtn = document.getElementById('close-viewer-btn');
        let currentViewingRecord = null;
        let isShowingMaskInViewer = false;

        const WARP_SIZE = 500;

        let cvReady = false;
        let isCaptured = false;
        let lastRawMat = null;
        let lastRawCroppedCanvas = null;
        let currentCalculatedArea = "0.00";
        let currentThreshApplied = 110;
        let mediaStream = null;
        let videoTrack = null;
        let focusTimer = null;

        let isManualMode = false;
        let manualPoints = [];
        let isDrawing = false;
        let activePointIndex = -1;
        let warpedBaseCanvas = null;

        let zoomScale = 1.0;
        let panOffsetX = 0;
        let panOffsetY = 0;
        let initialPinchDistance = null;
        let startPanX = 0;
        let startPanY = 0;

        let records = JSON.parse(localStorage.getItem('rock_test_records') || '[]');

        function getRealAreaCm2() {
            const sideMm = parseFloat(frameSizeInput.value) || 100.0;
            return (sideMm * sideMm) / 100.0;
        }

        function onOpenCvReady() {
            cvReady = true;
            statusText.textContent = 'Готов к замеру';
            statusBadge.style.color = '#10b981';
            captureBtn.disabled = false;
            galleryBtn.disabled = false;
        }

        try {
            if (window.DeviceOrientationEvent) {
                window.addEventListener('deviceorientation', (e) => {
                    if (e.beta === null || e.gamma === null) return;
                    let x = Math.max(-14, Math.min(14, e.gamma * 0.7));
                    let y = Math.max(-14, Math.min(14, e.beta * 0.7));
                    gyroBubble.style.transform = `translate(${x}px, ${y}px)`;
                    const totalTilt = Math.sqrt(e.beta * e.beta + e.gamma * e.gamma);
                    gyroLabel.textContent = `${Math.round(totalTilt)}°`;
                    gyroBubble.style.background = totalTilt <= 4 ? '#10b981' : '#f59e0b';
                });
            }
        } catch (e) {}

        function stopCamera() {
            if (focusTimer) clearTimeout(focusTimer);
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
            }
            mediaStream = null;
            videoTrack = null;
            video.srcObject = null;
        }

        async function initCamera() {
            if (isCaptured) return;
            stopCamera();

            video.setAttribute('autoplay', '');
            video.setAttribute('muted', '');
            video.setAttribute('playsinline', '');

            let stream = null;
            try {
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } }, 
                    audio: false 
                });
            } catch (err1) {
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
                } catch (err2) {
                    try {
                        stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                    } catch (err3) {
                        statusText.textContent = 'Камера отклонена';
                        return;
                    }
                }
            }

            if (stream) {
                mediaStream = stream;
                video.srcObject = stream;
                videoTrack = stream.getVideoTracks()[0];
                
                let playPromise = video.play();
                if (playPromise !== undefined) {
                    playPromise.catch(() => {
                        video.muted = true;
                    });
                }
                applyContinuousFocus();
            }
        }

        async function applyContinuousFocus() {
            if (!videoTrack) return;
            try {
                const caps = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
                if (caps.focusMode && caps.focusMode.includes('continuous')) {
                    await videoTrack.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
                }
            } catch (e) {}
        }

        viewWrapper.addEventListener('click', async (e) => {
            if (isCaptured || !videoTrack) return;

            const rect = viewWrapper.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            focusIndicator.style.left = clickX + 'px';
            focusIndicator.style.top = clickY + 'px';
            focusIndicator.style.opacity = '1';
            focusIndicator.style.transform = 'translate(-50%, -50%) scale(1)';

            if (focusTimer) clearTimeout(focusTimer);
            focusTimer = setTimeout(() => {
                focusIndicator.style.opacity = '0';
                focusIndicator.style.transform = 'translate(-50%, -50%) scale(0.8)';
            }, 1000);

            try {
                const caps = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
                if (caps.focusMode && caps.focusMode.includes('continuous')) {
                    await videoTrack.applyConstraints({ advanced: [{ focusMode: 'auto' }] });
                    setTimeout(async () => {

                        }

            } catch (err) {}

        function getCanvasCoordinates(clientX, clientY) {
            const rect = manualCanvas.getBoundingClientRect();
            const rawX = ((clientX - rect.left) / rect.width) * WARP_SIZE;
            const rawY = ((clientY - rect.top) / rect.height) * WARP_SIZE;
            return {
                x: (rawX - panOffsetX) / zoomScale,
                y: (rawY - panOffsetY) / zoomScale
            };
        }

        function updateLoupe(screenX, screenY) {
            if (!warpedBaseCanvas) return;
            zoomLoupe.style.display = 'block';

            loupeCtx.clearRect(0, 0, 90, 90);
            loupeCtx.save();
            loupeCtx.beginPath();
            loupeCtx.arc(45, 45, 45, 0, Math.PI * 2);
            loupeCtx.clip();

            const zoomFactor = 2.5;
            const sourceW = 90 / zoomFactor;
            const sourceH = 90 / zoomFactor;
            const sourceX = Math.max(0, Math.min(WARP_SIZE - sourceW, screenX - sourceW / 2));
            const sourceY = Math.max(0, Math.min(WARP_SIZE - sourceH, screenY - sourceH / 2));

            loupeCtx.drawImage(warpedBaseCanvas, sourceX, sourceY, sourceW, sourceH, 0, 0, 90, 90);

            loupeCtx.strokeStyle = '#06b6d4';
            loupeCtx.lineWidth = 1.5;
            loupeCtx.beginPath();
            loupeCtx.moveTo(45, 30); loupeCtx.lineTo(45, 60);
            loupeCtx.moveTo(30, 45); loupeCtx.lineTo(60, 45);
            loupeCtx.stroke();
            loupeCtx.restore();
        }

        manualCanvas.addEventListener('touchstart', (e) => {
            if (!isManualMode) return;

            if (e.touches.length === 2) {
                isDrawing = false;
                activePointIndex = -1;
                zoomLoupe.style.display = 'none';
                initialPinchDistance = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                return;
            }

            const touch = e.touches[0];
            const pt = getCanvasCoordinates(touch.clientX, touch.clientY);

            activePointIndex = -1;
            const hitRadius = 26 / zoomScale;
            for (let i = 0; i < manualPoints.length; i++) {
                const dist = Math.hypot(manualPoints[i].x - pt.x, manualPoints[i].y - pt.y);
                if (dist < hitRadius) {
                    activePointIndex = i;
                    updateLoupe(manualPoints[i].x, manualPoints[i].y);
                    break;
                }
            }

            if (activePointIndex === -1) {
                if (manualPoints.length > 2 && zoomScale > 1.05) {
                    startPanX = touch.clientX - panOffsetX;
                    startPanY = touch.clientY - panOffsetY;
                } else {
                    isDrawing = true;
                    manualPoints = [pt];
                }
            }
            redrawManualCanvas();
        });

        manualCanvas.addEventListener('touchmove', (e) => {
            if (!isManualMode) return;

            if (e.touches.length === 2 && initialPinchDistance) {
                const dist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                const factor = dist / initialPinchDistance;
                zoomScale = Math.max(1.0, Math.min(3.5, zoomScale * factor));
                initialPinchDistance = dist;
                redrawManualCanvas();
                return;
            }

            const touch = e.touches[0];
            const pt = getCanvasCoordinates(touch.clientX, touch.clientY);

            if (activePointIndex !== -1) {
                manualPoints[activePointIndex] = pt;
                updateLoupe(pt.x, pt.y);
                calculateManualArea();
                redrawManualCanvas();
            } else if (isDrawing) {
                const last = manualPoints[manualPoints.length - 1];
                if (!last || Math.hypot(last.x - pt.x, last.y - pt.y) > (8 / zoomScale)) {
                    manualPoints.push(pt);
                    redrawManualCanvas();
                }
            } else if (zoomScale > 1.05 && startPanX) {
                panOffsetX = touch.clientX - startPanX;
                panOffsetY = touch.clientY - startPanY;
                redrawManualCanvas();
            }
        });

        manualCanvas.addEventListener('touchend', () => {
            if (!isManualMode) return;
            zoomLoupe.style.display = 'none';
            initialPinchDistance = null;
            startPanX = 0;
            startPanY = 0;

            if (isDrawing) {
                isDrawing = false;
                if (manualPoints.length > 25) {
                    const step = Math.ceil(manualPoints.length / 22);
                    manualPoints = manualPoints.filter((_, idx) => idx % step === 0);
                }
                calculateManualArea();
                redrawManualCanvas();
            }
            activePointIndex = -1;
        });

        function calculateManualArea() {
            if (manualPoints.length < 3) {
                currentCalculatedArea = "0.00";
                areaDisplay.textContent = "0.00";
                return;
            }

            let areaPx = 0;
            const n = manualPoints.length;
            for (let i = 0; i < n; i++) {
                const j = (i + 1) % n;
                areaPx += manualPoints[i].x * manualPoints[j].y;
                areaPx -= manualPoints[j].x * manualPoints[i].y;
            }
            areaPx = Math.abs(areaPx) / 2.0;

            const realAreaCm2 = getRealAreaCm2();
            currentCalculatedArea = ((areaPx / (WARP_SIZE * WARP_SIZE)) * realAreaCm2).toFixed(2);
            areaDisplay.textContent = currentCalculatedArea;
            infoDisplay.innerHTML = `<span style="color:var(--accent-mint);">✓ Ручной замер: S = ${currentCalculatedArea} см²</span>`;
        }

        function redrawManualCanvas() {
            manualCtx.clearRect(0, 0, WARP_SIZE, WARP_SIZE);

            manualCtx.save();
            manualCtx.translate(panOffsetX, panOffsetY);
            manualCtx.scale(zoomScale, zoomScale);

            if (warpedBaseCanvas) {
                manualCtx.drawImage(warpedBaseCanvas, 0, 0, WARP_SIZE, WARP_SIZE);
            }

            if (manualPoints.length >= 2) {
                manualCtx.beginPath();
                manualCtx.moveTo(manualPoints[0].x, manualPoints[0].y);
                for (let i = 1; i < manualPoints.length; i++) {
                    manualCtx.lineTo(manualPoints[i].x, manualPoints[i].y);
                }
                manualCtx.closePath();
                manualCtx.fillStyle = "rgba(16, 185, 129, 0.42)";
                manualCtx.fill();

                manualCtx.strokeStyle = "#10b981";
                manualCtx.lineWidth = 3 / zoomScale;
                manualCtx.stroke();

                if (!isDrawing && manualPoints.length >= 3) {
                    manualPoints.forEach((p, idx) => {
                        manualCtx.beginPath();
                        manualCtx.arc(p.x, p.y, 6.5 / zoomScale, 0, Math.PI * 2);
                        manualCtx.fillStyle = idx === activePointIndex ? "#38bdf8" : "#ffffff";
                        manualCtx.fill();
                        manualCtx.strokeStyle = "#0f172a";
                        manualCtx.lineWidth = 2 / zoomScale;
                        manualCtx.stroke();
                    });
                }
            }

            manualCtx.restore();
        }

        function generateMaskSnapshot() {
            const offscreen = document.createElement('canvas');

            if (warpedBaseCanvas) {

                oCtx.closePath();
                oCtx.fillStyle = "rgba(16, 185, 129, 0.45)";
                oCtx.fill();
                oCtx.strokeStyle = "#10b981";
                oCtx.lineWidth = 3;
                oCtx.stroke();
            } else if (outputCanvas) {
                oCtx.drawImage(outputCanvas, 0, 0, WARP_SIZE, WARP_SIZE);

            return offscreen.toDataURL('image/jpeg', 0.85);
        }

        // ПРЯМОЕ СОХРАНЕНИЕ СТРОГО В ПАПКУ "DOCUMENTS" ВО ВНУТРЕННЕМ ХРАНИЛИЩЕ
        function saveBlobDirectlyToDevice(blob, fileName) {
            if (window.cordova && cordova.file) {
                const targetDirUri = cordova.file.externalRootDirectory + 'Documents/';

                window.resolveLocalFileSystemURL(targetDirUri, function(dirEntry) {
                    dirEntry.getFile(fileName, { create: true, exclusive: false }, function(fileEntry) {
                        fileEntry.createWriter(function(writer) {
                            writer.onwriteend = function() {
                                fileEntry.file(function(realFile) {
                                    const sizeKb = (realFile.size / 1024).toFixed(1);
                                    alert(`✓ Файл сохранён на телефон!\n\nИмя: ${fileName}\nРазмер: ${sizeKb} КБ\n\nПапка: Documents (Документы)`);
                                });
                            };
                            writer.onerror = function() {
                                alert('Ошибка записи файла.');
                            };
                            writer.write(blob);
                        });
                    }, function() {
                        alert('Ошибка создания файла.');
                    });
                }, function() {
                    alert('Ошибка доступа к Документам.');
                });
                return;
            }

            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            setTimeout(() => {
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, 1000);
        }

        // Скачивание отдельного снимка маски
        window.saveSingleSamplePhoto = function(id) {
            const rec = records.find(r => r.id === id);
            if (!rec || !rec.maskImg) return;

            const base64Data = rec.maskImg.replace(/^data:image\/[a-z]+;base64,/, "");
            const byteCharacters = atob(base64Data);
            const byteNumbers = new Array(byteCharacters.length);
            for (let i = 0; i < byteCharacters.length; i++) {
                byteNumbers[i] = byteCharacters.charCodeAt(i);
            }
            const byteArray = new Uint8Array(byteNumbers);
            const blob = new Blob([byteArray], { type: 'image/jpeg' });
            const fileName = `${rec.name}_S-${rec.area}cm2.jpg`;

            saveBlobDirectlyToDevice(blob, fileName);
        };

        togglePhotoModeBtn.onclick = () => {

            isShowingMaskInViewer = !isShowingMaskInViewer;
            viewerImgEl.src = isShowingMaskInViewer ? currentViewingRecord.maskImg : currentViewingRecord.rawImg;
            togglePhotoModeBtn.textContent = isShowingMaskInViewer ? 'Показать исходник' : 'Показать маску';
        };

        closeViewerBtn.onclick = () => {
            photoViewer.style.display = 'none';
            currentViewingRecord = null;
        };

        function generateCsvStringForArray(recordsArray) {
            let csv = '\uFEFF№;Шифр образца;Площадь (см²);База (мм);Тип;Дата;Время;Порог\n';
            recordsArray.forEach((r, i) => {
                csv += `${i + 1};${r.name};${r.area};${r.baseMm};${r.mode};${r.date};${r.time};${r.threshold}\n`;
            });
            return csv;
        }

        // Скачивание CSV таблицы за период (С ИСПОЛЬЗОВАНИЕМ BLOB КАК ПРОСИЛИ)
        exportExcelPeriodBtn.onclick = function() {
            const filtered = getFilteredRecords();
            if (filtered.length === 0) {
                alert('Нет замеров за выбранный период!');
                return;
            }

            const fromStr = filterDateFrom.value || 'все';
            const toStr = filterDateTo.value || 'все';
            const fileName = `Отчёт_керн_${fromStr}_по_${toStr}.csv`;
            const csvContent = generateCsvStringForArray(filtered);
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8' });

            saveBlobDirectlyToDevice(blob, fileName);
        };

        // Пакетный ZIP-архив за период (С ИСПОЛЬЗОВАНИЕМ BLOB КАК ПРОСИЛИ)
        exportZipPeriodBtn.onclick = async function() {
            const filtered = getFilteredRecords();
            if (filtered.length === 0) {
                alert('Нет замеров за выбранный период!');
                return;
            }

            exportZipPeriodBtn.style.opacity = '0.5';
            exportZipPeriodBtn.style.pointerEvents = 'none';

            try {
                const zip = new JSZip();
                const folderRaw = zip.folder("1_Исходники");
                const folderMasks = zip.folder("2_Контуры_маски");

                filtered.forEach((rec, idx) => {
                    const prefix = `${idx + 1}_${rec.name}`;
                    const rawBase64 = (rec.rawImg || '').replace(/^data:image\/[a-z]+;base64,/, "");
                    const maskBase64 = (rec.maskImg || '').replace(/^data:image\/[a-z]+;base64,/, "");
                    if (rawBase64) folderRaw.file(`${prefix}_исходник.jpg`, rawBase64, { base64: true });
                    if (maskBase64) folderMasks.file(`${prefix}_маска_${rec.area}см2.jpg`, maskBase64, { base64: true });
                });

                const csvData = generateCsvStringForArray(filtered);
                zip.file("Журнал_испытаний.csv", csvData);

                const fromStr = filterDateFrom.value || 'все';
                const toStr = filterDateTo.value || 'все';
                const fileName = `Фотоархив_керна_${fromStr}_по_${toStr}.zip`;

                const zipBlob = await zip.generateAsync({ type: "blob" });
                saveBlobDirectlyToDevice(zipBlob, fileName);
            } catch (err) {
                alert('Ошибка создания ZIP: ' + err.message);
            } finally {
                exportZipPeriodBtn.style.opacity = '1';
                exportZipPeriodBtn.style.pointerEvents = 'auto';
            }
        };

        // Формирование HTML-фотопротокола (С ИСПОЛЬЗОВАНИЕМ BLOB КАК ПРОСИЛИ)
        exportHtmlReportBtn.onclick = function() {
            const filtered = getFilteredRecords();
            if (filtered.length === 0) {
                alert('Нет замеров за выбранный период!');
                return;
            }

            const fromStr = filterDateFrom.value || 'все';
            const toStr = filterDateTo.value || 'все';
            const fileName = `Протокол_испытаний_${fromStr}_по_${toStr}.html`;

            let htmlDoc = `<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Протокол планиметрии керна</title>
<style>
  body { font-family: Arial, sans-serif; padding: 20px; color: #111; background: #fff; }
  h2 { margin-bottom: 4px; }
  .meta { color: #555; font-size: 13px; margin-bottom: 20px; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  th, td { border: 1px solid #ccc; padding: 8px 10px; text-align: left; font-size: 13px; vertical-align: middle; }
  th { background: #f4f4f4; }
  .thumb { width: 90px; height: 90px; object-fit: cover; border-radius: 6px; border: 1px solid #ddd; display: block; }
  .area-cell { font-size: 15px; font-weight: bold; color: #059669; }
  @media print { .no-print { display: none; } }
</style>
</head>
<body>
  <h2>Протокол оптического измерения площади керна</h2>
  <div class="meta">Период: с ${fromStr} по ${toStr} | Всего замеров: ${filtered.length}</div>
  <button class="no-print" onclick="window.print()" style="padding: 8px 16px; margin-bottom: 16px; cursor: pointer;">Печать / Сохранить в PDF</button>
  <table>
    <thead>
      <tr>
        <th>№</th>
        <th>Шифр</th>
        <th>S, см²</th>
        <th>База, мм</th>
        <th>Дата / Время</th>
        <th>Исходник</th>
        <th>Контур скола</th>
      </tr>
    </thead>
    <tbody>`;

            filtered.forEach((r, idx) => {
                htmlDoc += `
      <tr>
        <td>${idx + 1}</td>
        <td><b>${r.name}</b></td>
        <td class="area-cell">${r.area}</td>
        <td>${r.baseMm}</td>
        <td>${r.date} ${r.time}</td>
        <td><img class="thumb" src="${r.rawImg}" alt="Исходник"></td>
        <td><img class="thumb" src="${r.maskImg}" alt="Маска"></td>
      </tr>`;
            });

            htmlDoc += `
    </tbody>
  </table>
</body>
</html>`;

            const blob = new Blob([htmlDoc], { type: 'text/html;charset=utf-8' });
            saveBlobDirectlyToDevice(blob, fileName);
        };

        // =============================================================
        // OPENCV АЛГОРИТМЫ
        // =============================================================
        function orderPoints(ptsArr) {
            ptsArr.sort((a, b) => a.y - b.y);
            let topTwo = [ptsArr[0], ptsArr[1]].sort((a, b) => a.x - b.x);
            let botTwo = [ptsArr[2], ptsArr[3]].sort((a, b) => a.x - b.x);
            return [topTwo[0], topTwo[1], botTwo[1], botTwo[0]];
        }

        function findFrameQuad(edged, minArea) {
            let contours = new cv.MatVector();
            let hierarchy = new cv.Mat();
            cv.findContours(edged, contours, hierarchy, cv.RETR_LIST, cv.CHAIN_APPROX_SIMPLE);

            let bestQuad = null;
            let maxArea = 0;

            for (let i = 0; i < contours.size(); i++) {
                let cnt = contours.get(i);
                let peri = cv.arcLength(cnt, true);
                let approx = new cv.Mat();
                cv.approxPolyDP(cnt, approx, 0.02 * peri, true);

                if (approx.rows === 4) {
                    let a = cv.contourArea(approx);
                    if (a > minArea && a > maxArea) {
                        maxArea = a;
                        let pts = [];
                        for (let j = 0; j < 4; j++) {
                            pts.push({ x: approx.data32S[j*2], y: approx.data32S[j*2+1] });
                        }
                        bestQuad = orderPoints(pts);
                    }
                }
                approx.delete();
                cnt.delete();
            }
            hierarchy.delete();
            contours.delete();
            return bestQuad;
        }

        function findFourCornersQuad(grayMat) {
            let bin = new cv.Mat();
            cv.threshold(grayMat, bin, 80, 255, cv.THRESH_BINARY_INV + cv.THRESH_OTSU);

            let contours = new cv.MatVector();
            let hierarchy = new cv.Mat();
            cv.findContours(bin, contours, hierarchy, cv.RETR_LIST, cv.CHAIN_APPROX_SIMPLE);

            let candidates = [];
            for (let i = 0; i < contours.size(); i++) {
                let cnt = contours.get(i);
                let a = cv.contourArea(cnt);
                if (a > 100 && a < 15000) {
                    let rect = cv.boundingRect(cnt);
                    let ratio = rect.width / rect.height;
                    if (ratio > 0.6 && ratio < 1.4) {
                        let m = cv.moments(cnt);
                        if (m.m00 !== 0) {
                            candidates.push({ x: m.m10 / m.m00, y: m.m01 / m.m00 });
                        }
                    }
                }
                cnt.delete();
            }
            bin.delete(); hierarchy.delete(); contours.delete();

            if (candidates.length < 4) return null;

            candidates.sort((a, b) => (a.x + a.y) - (b.x + b.y));
            let topLeft = candidates[0];
            let bottomRight = candidates[candidates.length - 1];

            candidates.sort((a, b) => (a.x - a.y) - (b.x - b.y));
            let bottomLeft = candidates[0];
            let topRight = candidates[candidates.length - 1];

            return orderPoints([topLeft, topRight, bottomRight, bottomLeft]);
        }

        function processFrame(srcMat, manualThreshold) {
            let gray = new cv.Mat(), blur = new cv.Mat(), edged = new cv.Mat();
            cv.cvtColor(srcMat, gray, cv.COLOR_RGBA2GRAY);
            cv.GaussianBlur(gray, blur, new cv.Size(5, 5), 0);
            cv.Canny(blur, edged, 40, 140);

            let quad = null;
            const mode = targetMode.value;

            if (mode === 'frame') {
                quad = findFrameQuad(edged, 12000);
            } else {
                quad = findFourCornersQuad(gray);
            }

            gray.delete(); blur.delete(); edged.delete();

            if (!quad) {
                cv.imshow('output-canvas', srcMat);
                infoDisplay.innerHTML = `<span style="color:var(--accent-red);">${mode === 'frame' ? 'Рамка не найдена!' : '4 маркера не найдены!'} Перейдите в "Ручное лассо"</span>`;
                areaDisplay.textContent = '0.00';

                warpedBaseCanvas = document.createElement('canvas');
                warpedBaseCanvas.width = WARP_SIZE;
                warpedBaseCanvas.height = WARP_SIZE;
                const baseCtx = warpedBaseCanvas.getContext('2d');
                baseCtx.drawImage(outputCanvas, 0, 0, WARP_SIZE, WARP_SIZE);

                lastRawCroppedCanvas = document.createElement('canvas');
                lastRawCroppedCanvas.width = WARP_SIZE;
                lastRawCroppedCanvas.height = WARP_SIZE;
                lastRawCroppedCanvas.getContext('2d').drawImage(outputCanvas, 0, 0, WARP_SIZE, WARP_SIZE);
                return;
            }

            let srcTri = cv.matFromArray(4, 1, cv.CV_32FC2, [
                quad[0].x, quad[0].y,
                quad[1].x, quad[1].y,
                quad[2].x, quad[2].y,
                quad[3].x, quad[3].y
            ]);
            let dstTri = cv.matFromArray(4, 1, cv.CV_32FC2, [0, 0, WARP_SIZE, 0, WARP_SIZE, WARP_SIZE, 0, WARP_SIZE]);
            let M = cv.getPerspectiveTransform(srcTri, dstTri);
            let warped = new cv.Mat();
            cv.warpPerspective(srcMat, warped, M, new cv.Size(WARP_SIZE, WARP_SIZE));

            warpedBaseCanvas = document.createElement('canvas');
            warpedBaseCanvas.width = WARP_SIZE;
            warpedBaseCanvas.height = WARP_SIZE;
            cv.imshow(warpedBaseCanvas, warped);

            let pad = mode === 'frame' ? 25 : 10;
            let roiRect = new cv.Rect(pad, pad, WARP_SIZE - 2*pad, WARP_SIZE - 2*pad);
            let cropped = warped.roi(roiRect);

            lastRawCroppedCanvas = document.createElement('canvas');
            lastRawCroppedCanvas.width = cropped.cols;
            lastRawCroppedCanvas.height = cropped.rows;
            cv.imshow(lastRawCroppedCanvas, cropped);

            let cropGray = new cv.Mat(), cropBlur = new cv.Mat();
            cv.cvtColor(cropped, cropGray, cv.COLOR_RGBA2GRAY);
            cv.GaussianBlur(cropGray, cropBlur, new cv.Size(5, 5), 0);

            let rawMask = new cv.Mat();
            let appliedThresh = manualThreshold;
            if (appliedThresh === null) {
                appliedThresh = Math.round(cv.threshold(cropBlur, rawMask, 0, 255, cv.THRESH_BINARY_INV + cv.THRESH_OTSU));
                threshSlider.value = appliedThresh;
                threshVal.textContent = appliedThresh + ' (Авто)';
            } else {
                cv.threshold(cropBlur, rawMask, appliedThresh, 255, cv.THRESH_BINARY_INV);
                threshVal.textContent = appliedThresh;
            }
            currentThreshApplied = appliedThresh;

            let objContours = new cv.MatVector(), objHierarchy = new cv.Mat();
            cv.findContours(rawMask, objContours, objHierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

            let solidMask = cv.Mat.zeros(cropped.rows, cropped.cols, cv.CV_8U);
            let maxStoneArea = 0, stoneContourIdx = -1;
            for (let i = 0; i < objContours.size(); i++) {
                let a = cv.contourArea(objContours.get(i));
                if (a > maxStoneArea) { maxStoneArea = a; stoneContourIdx = i; }
            }

            if (stoneContourIdx !== -1) {
                cv.drawContours(solidMask, objContours, stoneContourIdx, new cv.Scalar(255), -1);
            }

            let stonePixels = cv.countNonZero(solidMask);
            const realAreaCm2 = getRealAreaCm2();
            currentCalculatedArea = ((stonePixels / (WARP_SIZE * WARP_SIZE)) * realAreaCm2).toFixed(2);

            for (let r = 0; r < cropped.rows; r++) {
                for (let c = 0; c < cropped.cols; c++) {
                    if (solidMask.ucharPtr(r, c)[0] > 0) {
                        let ptr = cropped.ucharPtr(r, c);
                        ptr[0] = 16; ptr[1] = 185; ptr[2] = 129;
                    }
                }
            }

            cv.imshow('output-canvas', warped);
            areaDisplay.textContent = currentCalculatedArea;
            infoDisplay.innerHTML = `<span style="color:var(--accent-mint);">✓ База ${frameSizeInput.value} мм | S = ${currentCalculatedArea} см²</span>`;

            srcTri.delete(); dstTri.delete(); M.delete(); warped.delete();
            cropped.delete(); cropGray.delete(); cropBlur.delete();
            rawMask.delete(); objContours.delete(); objHierarchy.delete(); solidMask.delete();
        }

        updateArchiveCounter();

        function requestAndStartCamera() {
            if (window.cordova && cordova.plugins && cordova.plugins.permissions) {
                const permissions = cordova.plugins.permissions;
                permissions.checkPermission(permissions.CAMERA, function(status) {
                    if (status.hasPermission) {
                        initCamera();
                    } else {
                        permissions.requestPermission(permissions.CAMERA, function() {
                            initCamera();
                        }, function() {
                            initCamera();
                        });
                    }
                }, function() {
                    initCamera();
                });
            } else {
                initCamera();
            }
        }

        if (window.cordova) {
            document.addEventListener('deviceready', requestAndStartCamera, false);
        } else {
            document.addEventListener('DOMContentLoaded', requestAndStartCamera);
        }
    </script>
</body>
