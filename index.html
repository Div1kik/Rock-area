<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Авто-захват площади скола</title>
    <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="onOpenCvReady();" type="text/javascript"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background: #121212; color: #fff; display: flex; flex-direction: column; align-items: center; padding: 12px; }
        h1 { font-size: 1.1rem; margin-bottom: 6px; font-weight: 500; }

        .view-container {
            position: relative;
            width: 320px;
            height: 320px;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }

        video, canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .status-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            background: rgba(0,0,0,0.7);
            color: #ff9500;
            z-index: 10;
        }

        /* Виджет гироскопа (уровня) */
        .gyro-widget {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: rgba(20, 20, 20, 0.75);
            border: 1.5px solid rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            box-shadow: 0 2px 6px rgba(0,0,0,0.5);
        }

        .gyro-target {
            position: absolute;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 1px dashed rgba(255, 255, 255, 0.4);
            pointer-events: none;
        }

        .gyro-bubble {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ff9500;
            box-shadow: 0 0 6px #ff9500;
            transition: transform 0.05s linear;
        }

        .gyro-label {
            position: absolute;
            bottom: -16px;
            font-size: 9px;
            color: #aaa;
            white-space: nowrap;
        }

        .controls {
            width: 320px;
            margin-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            background: #007aff;
            color: white;
            border: none;
            padding: 13px;
            font-size: 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn:disabled { background: #444; color: #888; }
        .btn:active:not(:disabled) { background: #0056b3; }

        .slider-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 13px;
            color: #ccc;
            background: #1c1c1e;
            padding: 8px 12px;
            border-radius: 8px;
        }

        .slider-row {
            display: flex;
            justify-content: space-between;
        }

        .result-card {
            margin-top: 12px;
            width: 320px;
            background: #1e1e1e;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #333;
        }
        .result-val {
            font-size: 1.8rem;
            color: #4cd964;
            font-weight: 700;
            margin: 4px 0;
        }
    </style>
</head>
<body>

    <h1>Авто-захват площади скола
