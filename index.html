<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Авто-захват рамки и площади</title>
    <!-- Подключаем оптимизированный OpenCV.js -->
    <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="onOpenCvReady();" type="text/javascript"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background: #121212; color: #fff; display: flex; flex-direction: column; align-items: center; padding: 12px; }
        h1 { font-size: 1.1rem; margin-bottom: 6px; font-weight: 500; }

        .view-container {
            position: relative;
            width: 320px;
            height: 320px;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }

        video, canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .status-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            background: rgba(0,0,0,0.7);
            color: #ff9500;
        }

        .controls {
            width: 320px;
            margin-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            background: #007aff;
            color: white;
            border: none;
            padding: 13px;
            font-size: 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn:disabled { background: #444; color: #888; }
        .btn:active:not(:disabled) { background: #0056b3; }

        .slider-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 13px;
            color: #ccc;
            background: #1c1c1e;
            padding: 8px 12px;
            border-radius: 8px;
        }

        .slider-row {
            display: flex;
            justify-content: space-between;
        }

        .result-card {
            margin-top: 12px;
            width: 320px;
            background: #1e1e1e;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #333;
        }
        .result-val {
            font-size: 1.8rem;
            color: #4cd964;
            font-weight: 700;
            margin: 4px 0;
        }
    </style>
</head>
<body>

    <h1>Авто-захват площади скола</h1>

    <div class="view-container">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="output-canvas" style="display: none;"></canvas>
        <div class="status-badge" id="status-badge">Загрузка CV модуля...</div>
    </div>

    <div class="controls">
        <button class="btn" id="capture-btn" disabled>Измерить (Авто-захват)</button>
        
        <div class="slider-group">
            <div class="slider-row">
                <span>Порог отсечения камня:</span>
                <span id="thresh-val">110</span>
            </div>
            <input type="range" id="thresh-slider" min="30" max="200" value="110">
        </div>
    </div>

    <div class="result-card">
        <div>Определенная площадь разрыва:</div>
        <div class="result-val" id="area-display">0.00 см²</div>
        <div style="font-size: 12px; color: #aaa;" id="info-display">Наведите камеру на квадратную рамку</div>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const outputCanvas = document.getElementById('output-canvas');
        const captureBtn = document.getElementById('capture-btn');
        const statusBadge = document.getElementById('status-badge');
        const threshSlider = document.getElementById('thresh-slider');
        const threshVal = document.getElementById('thresh-val');
        const areaDisplay = document.getElementById('area-display');
        const infoDisplay = document.getElementById('info-display');

        const REAL_FRAME_SIDE_MM = 100.0;
        const REAL_AREA_CM2 = (REAL_FRAME_SIDE_MM * REAL_FRAME_SIDE_MM) / 100.0; // 100 см²
        const WARP_SIZE = 500; // Разрешение выпрямленного квадрата 500x500 px

        let cvReady = false;
        let isCaptured = false;
        let lastRawMat = null;

        function onOpenCvReady() {
            cvReady = true;
            statusBadge.textContent = 'Готов к замеру';
            statusBadge.style.color = '#4cd964';
            captureBtn.disabled = false;
        }

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 } },
                    audio: false
                });
                video.srcObject = stream;
            } catch (err) {
                alert('Ошибка камеры: ' + err.name);
            }
        }

        threshSlider.oninput = () => {
            threshVal.textContent = threshSlider.value;
            if (isCaptured && lastRawMat) processFrame(lastRawMat);
        };

        captureBtn.addEventListener('click', () => {
            if (!cvReady) return;

            if (!isCaptured) {
                // Захватываем текущий кадр с камеры
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = video.videoWidth;
                tempCanvas.height = video.videoHeight;
                const ctx = tempCanvas.getContext('2d');
                ctx.drawImage(video, 0, 0);

                if (lastRawMat) lastRawMat.delete();
                lastRawMat = cv.imread(tempCanvas);

                video.style.display = 'none';
                outputCanvas.style.display = 'block';
                captureBtn.textContent = 'Новый замер';
                isCaptured = true;

                processFrame(lastRawMat);
            } else {
                outputCanvas.style.display = 'none';
                video.style.display = 'block';
                captureBtn.textContent = 'Измерить (Авто-захват)';
                infoDisplay.textContent = 'Наведите камеру на квадратную рамку';
                isCaptured = false;
            }
        });

        // Сортировка углов четырёхугольника: top-left, top-right, bottom-right, bottom-left
        function orderPoints(pts) {
            let ptsArr = [];
            for (let i = 0; i < 4; i++) ptsArr.push({ x: pts[i*2], y: pts[i*2+1] });

            ptsArr.sort((a, b) => a.y - b.y);
            let topTwo = [ptsArr[0], ptsArr[1]].sort((a, b) => a.x - b.x);
            let botTwo = [ptsArr[2], ptsArr[3]].sort((a, b) => a.x - b.x);

            return [topTwo[0], topTwo[1], botTwo[1], botTwo[0]];
        }

        function processFrame(srcMat) {
            let gray = new cv.Mat();
            let blur = new cv.Mat();
            let edged = new cv.Mat();

            // 1. Предварительная обработка для поиска границы рамки
            cv.cvtColor(srcMat, gray, cv.COLOR_RGBA2GRAY);
            cv.GaussianBlur(gray, blur, new cv.Size(5, 5), 0);
            cv.Canny(blur, edged, 50, 150);

            // 2. Поиск внешних контуров
            let contours = new cv.MatVector();
            let hierarchy = new cv.Mat();
            cv.findContours(edged, contours, hierarchy, cv.RETR_LIST, cv.CHAIN_APPROX_SIMPLE);

            let squareContour = null;
            let maxArea = 0;

            for (let i = 0; i < contours.size(); i++) {
                let cnt = contours.get(i);
                let peri = cv.arcLength(cnt, true);
                let approx = new cv.Mat();
                cv.approxPolyDP(cnt, approx, 0.02 * peri, true);

                // Ищем замкнутый 4-угольник достаточного размера
                if (approx.rows === 4) {
                    let area = cv.contourArea(approx);
                    if (area > 15000 && area > maxArea) {
                        maxArea = area;
                        if (squareContour) squareContour.delete();
                        squareContour = approx.clone();
                    }
                }
                approx.delete();
                cnt.delete();
            }

            gray.delete(); blur.delete(); edged.delete(); hierarchy.delete(); contours.delete();

            if (!squareContour) {
                // Если рамка не распозналась — показываем кадр как есть
                cv.imshow('output-canvas', srcMat);
                infoDisplay.innerHTML = '<span style="color:#ff453a;">Рамка не найдена! Сделайте линию ярче и держите камеру ровнее.</span>';
                areaDisplay.textContent = '0.00 см²';
                return;
            }

            // 3. Выпрямление перспективы (Warp Perspective)
            const ordered = orderPoints(squareContour.data32S);
            squareContour.delete();

            let srcTri = cv.matFromArray(4, 1, cv.CV_32FC2, [
                ordered[0].x, ordered[0].y,
                ordered[1].x, ordered[1].y,
                ordered[2].x, ordered[2].y,
                ordered[3].x, ordered[3].y
            ]);

            // Проецируем в идеальный квадрат 500x500 px
            let dstTri = cv.matFromArray(4, 1, cv.CV_32FC2, [
                0, 0,
                WARP_SIZE, 0,
                WARP_SIZE, WARP_SIZE,
                0, WARP_SIZE
            ]);

            let M = cv.getPerspectiveTransform(srcTri, dstTri);
            let warped = new cv.Mat();
            cv.warpPerspective(srcMat, warped, M, new cv.Size(WARP_SIZE, WARP_SIZE));

            // 4. Поиск камня внутри выпрямленного квадрата
            // Отступаем по 25 px внутрь от краёв, чтобы срезать саму нарисованную чёрную рамку
            let pad = 25;
            let roiRect = new cv.Rect(pad, pad, WARP_SIZE - 2*pad, WARP_SIZE - 2*pad);
            let cropped = warped.roi(roiRect);

            let cropGray = new cv.Mat();
            cv.cvtColor(cropped, cropGray, cv.COLOR_RGBA2GRAY);

            let threshValUser = parseInt(threshSlider.value, 10);
            let mask = new cv.Mat();
            // Бинаризация: тёмные пиксели камня становятся белыми в маске
            cv.threshold(cropGray, mask, threshValUser, 255, cv.THRESH_BINARY_INV);

            let stonePixels = cv.countNonZero(mask);
            let totalFramePixels = WARP_SIZE * WARP_SIZE; // Полная эталонная площадь квадрата

            // Подкрашиваем найденный камень зелёным цветом прямо на выпрямленном снимке
            for (let r = 0; r < cropped.rows; r++) {
                for (let c = 0; c < cropped.cols; c++) {
                    if (mask.ucharPtr(r, c)[0] > 0) {
                        let ptr = cropped.ucharPtr(r, c);
                        ptr[0] = 0;   // R
                        ptr[1] = 230; // G
                        ptr[2] = 80;  // B
                    }
                }
            }

            // Выводим результат на экран
            cv.imshow('output-canvas', warped);

            const areaCm2 = (stonePixels / totalFramePixels) * REAL_AREA_CM2;
            areaDisplay.textContent = areaCm2.toFixed(2) + ' см²';
            infoDisplay.innerHTML = '<span style="color:#4cd964;">✓ Рамка захвачена и перспектива выровнена!</span>';

            srcTri.delete(); dstTri.delete(); M.delete(); warped.delete();
            cropped.delete(); cropGray.delete(); mask.delete();
        }
                async function initCamera() {
            const configs = [
                { video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 } }, audio: false },
                { video: { facingMode: "environment" }, audio: false },
                { video: true, audio: false }
            ];

            for (let config of configs) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia(config);
                    video.srcObject = stream;
                    await video.play(); // Запускаем воспроизведение видеопотока
                    return;
                } catch (err) {
                    console.warn("Попытка не удалась:", err);
                }
            }

            alert('Не удалось запустить камеру. Проверьте, закрыта ли стандартная камера и выключен ли фонарик.');
        }

        // ОБЯЗАТЕЛЬНО: вызываем функцию запуска камеры
        initCamera();
    </script>
</body>
</html>

</html>
