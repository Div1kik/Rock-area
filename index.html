<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Лабораторный планиметр керна</title>
    <script src="cordova.js"></script>
    <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="onOpenCvReady();" type="text/javascript"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --bg-base: #0b0f19;
            --bg-surface: #131c2e;
            --bg-card: rgba(22, 33, 54, 0.88);
            --card-border: rgba(148, 163, 184, 0.12);
            --accent-mint: #10b981;
            --accent-mint-glow: rgba(16, 185, 129, 0.25);
            --accent-cyan: #06b6d4;
            --accent-blue: #3b82f6;
            --accent-red: #ef4444;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: radial-gradient(circle at top, #131e33 0%, var(--bg-base) 100%);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px 14px 44px;
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }

        header {
            width: 100%;
            max-width: 360px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .app-brand {
            font-size: 1.15rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -0.3px;
        }

        .view-wrapper {
            position: relative;
            width: 100%;
            max-width: 360px;
            aspect-ratio: 1 / 1;
            border-radius: 22px;
            overflow: hidden;
            background: #020617;
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.55), 0 0 0 1px var(--card-border);
            cursor: crosshair;
            touch-action: none;
        }

        video, canvas { width: 100%; height: 100%; object-fit: cover; }

        #manual-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: auto;
            z-index: 15;
            display: none;
        }

        .reticle-corners {
            position: absolute;
            inset: 22px;
            pointer-events: none;
            border: 2px dashed rgba(148, 163, 184, 0.25);
            border-radius: 14px;
            z-index: 5;
        }

        .focus-indicator {
            position: absolute;
            width: 50px;
            height: 50px;
            border: 2px solid var(--accent-cyan);
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
            transform: translate(-50%, -50%) scale(1.4);
            transition: opacity 0.2s, transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 25;
            box-shadow: 0 0 14px rgba(6, 182, 212, 0.45);
        }

        .status-badge {
            position: absolute;
            top: 14px;
            left: 14px;
            padding: 6px 12px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 600;
            background: rgba(11, 15, 25, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid var(--card-border);
            color: #f59e0b;
            display: flex;
            align-items: center;
            gap: 6px;
            z-index: 10;
        }
        .status-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

        .gyro-widget {
            position: absolute;
            top: 14px;
            right: 14px;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: rgba(11, 15, 25, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        .gyro-target { position: absolute; width: 14px; height: 14px; border-radius: 50%; border: 1px dashed rgba(255,255,255,0.3); }
        .gyro-bubble { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: #f59e0b; box-shadow: 0 0 8px #f59e0b; transition: transform 0.05s linear; }
        .gyro-label { position: absolute; bottom: -17px; font-size: 9px; font-weight: 600; color: var(--text-secondary); }

        .container {
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 14px;
        }

        .result-card {
            background: var(--bg-card);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 16px;
            text-align: center;
            backdrop-filter: blur(14px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
        }
        .result-label { font-size: 11px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.8px; }
        .result-val-wrap { display: flex; align-items: baseline; justify-content: center; gap: 6px; margin: 4px 0; }
        .result-val {
            font-size: 2.6rem;
            color: var(--accent-mint);
            font-weight: 800;
            letter-spacing: -1px;
            font-feature-settings: "tnum";
            text-shadow: 0 0 24px var(--accent-mint-glow);
        }
        .result-unit { font-size: 1.15rem; color: var(--accent-mint); font-weight: 600; }
        .info-msg { font-size: 12px; color: var(--text-secondary); }

        .mode-toggle-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            background: #0f172a;
            padding: 5px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
        }
        .mode-toggle-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 9px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 9px;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .mode-toggle-btn.active {
            background: var(--accent-blue);
            color: #fff;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.35);
        }

        .panel-box {
            background: var(--bg-card);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            backdrop-filter: blur(14px);
        }

        .slider-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-secondary); font-weight: 500; }
        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #1e293b;
            accent-color: var(--accent-cyan);
            outline: none;
        }

        .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #fff;
            border: none;
            padding: 13px 14px;
            font-size: 13.5px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.12s ease, opacity 0.12s ease;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
            user-select: none;
        }
        .btn:active:not(:disabled) { transform: scale(0.97); }
        .btn:disabled { background: #1e293b; color: #475569; box-shadow: none; cursor: not-allowed; opacity: 0.6; }
        .btn-secondary {
            background: #1e293b;
            border: 1px solid var(--card-border);
            color: #f1f5f9;
            box-shadow: none;
        }
        .btn-green {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #fff;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
        }
        .btn-red {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: var(--accent-red);
            padding: 5px 8px;
            font-size: 11px;
            border-radius: 6px;
        }

        .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .input-group { display: flex; flex-direction: column; gap: 5px; }
        .input-label { font-size: 10.5px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }

        select, .input-text {
            background: #0f172a;
            border: 1px solid var(--card-border);
            color: #f8fafc;
            padding: 10px;
            border-radius: 10px;
            font-size: 13px;
            outline: none;
            width: 100%;
        }
        select:focus, .input-text:focus { border-color: var(--accent-cyan); }

        .log-section {
            background: var(--bg-card);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            backdrop-filter: blur(14px);
        }
        .log-header { display: flex; justify-content: space-between; align-items: center; }
        .log-title { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text-secondary); }
        .table-wrap {
            max-height: 190px;
            overflow-y: auto;
            border-radius: 10px;
            border: 1px solid var(--card-border);
            background: #0b1120;
        }
        table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: left; }
        th, td { padding: 9px 10px; border-bottom: 1px solid rgba(148, 163, 184, 0.08); }
        th { background: #131d33; color: var(--text-secondary); font-weight: 600; position: sticky; top: 0; }

        .export-btns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 4px;
        }
        .export-btns .btn {
            padding: 12px 6px;
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            justify-content: center;
        }
    </style>
</head>
<body>

    <header>
        <div class="app-brand">
            <span>📐</span>
            <span>Rock Area Core</span>
        </div>
    </header>

    <div class="view-wrapper" id="view-wrapper">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="output-canvas" style="display: none;"></canvas>
        <canvas id="manual-canvas"></canvas>
        <div class="reticle-corners"></div>
        <div class="focus-indicator" id="focus-indicator"></div>

        <div class="status-badge" id="status-badge">
            <span class="status-dot"></span>
            <span id="status-text">Инициализация CV...</span>
        </div>

        <div class="gyro-widget" id="gyro-box">
            <div class="gyro-target"></div>
            <div class="gyro-bubble" id="gyro-bubble"></div>
            <span class="gyro-label" id="gyro-label">0°</span>
        </div>
    </div>

    <div class="container">
        <!-- Блок площади -->
        <div class="result-card">
            <div class="result-label">Площадь скола</div>
            <div class="result-val-wrap">
                <span class="result-val" id="area-display">0.00</span>
                <span class="result-unit">см²</span>
            </div>
            <div class="info-msg" id="info-display">Нажмите на область для ручной фокусировки</div>
        </div>

        <!-- Переключатель режима: Автопорог или Ручное лассо -->
        <div class="mode-toggle-group" id="contour-mode-group" style="display: none;">
            <button class="mode-toggle-btn active" id="mode-auto-btn">⚡ Автопорог</button>
            <button class="mode-toggle-btn" id="mode-manual-btn">✏️ Ручное лассо</button>
        </div>

        <!-- Порог отсечения фона под результатом -->
        <div class="panel-box" id="threshold-box">
            <div class="slider-row">
                <span>Порог отсечения фона</span>
                <span id="thresh-val" style="color: var(--accent-cyan); font-weight: 600;">Авто</span>
            </div>
            <input type="range" id="thresh-slider" min="30" max="220" value="110">
        </div>

        <!-- Кнопка сброса ручного контура -->
        <button class="btn btn-secondary" id="clear-manual-btn" style="display: none; width: 100%;">
            <span>🧹</span> Сбросить ручной контур
        </button>

        <div class="btn-row" id="main-btns-row">
            <button class="btn" id="capture-btn" disabled>
                <span>📷</span> С камеры
            </button>
            <button class="btn btn-secondary" id="gallery-btn" disabled>
                <span>📁</span> Из галереи
            </button>
        </div>
        
        <input type="file" id="file-input" accept="image/*" style="display: none;">
        <button class="btn btn-secondary" id="reset-btn" style="display: none;">🔄 Новый замер</button>

        <div class="panel-box">
            <div class="settings-grid">
                <div class="input-group">
                    <label class="input-label" for="target-mode">Тип калибровки:</label>
                    <select id="target-mode">
                        <option value="frame" selected>Сплошная рамка</option>
                        <option value="dots">4 угловых маркера</option>
                    </select>
                </div>
                <div class="input-group">
                    <label class="input-label" for="frame-size-input">Сторона базы, мм:</label>
                    <input type="number" id="frame-size-input" class="input-text" value="100" min="20" max="1000" step="5">
                </div>
            </div>
        </div>

        <div id="save-panel" class="panel-box" style="display: none;">
            <div class="input-group">
                <label class="input-label" for="sample-name">Шифр керна / образца:</label>
                <input type="text" id="sample-name" class="input-text" placeholder="Керн-1">
            </div>
            <button class="btn btn-green" id="save-record-btn">📥 Записать в журнал смены</button>
        </div>

        <div class="log-section">
            <div class="log-header">
                <span class="log-title">Стек замеров (<span id="record-count">0</span>)</span>
                <button class="btn btn-secondary" style="padding: 5px 10px; font-size: 11px;" id="clear-all-btn">Очистить</button>
            </div>
            
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>№</th>
                            <th>Шифр</th>
                            <th>S, см²</th>
                            <th>База</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="log-tbody"></tbody>
                </table>
            </div>

            <div class="export-btns">
                <button class="btn btn-secondary" id="export-csv-btn">💾 В Загрузки (CSV)</button>
                <button class="btn btn-secondary" id="export-zip-btn">📦 В Загрузки (ZIP)</button>
            </div>
            <button class="btn btn-secondary" id="share-report-btn" style="width: 100%; margin-top: 6px;">
                <span>📤</span> Поделиться отчётом (CSV)
            </button>
        </div>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const viewWrapper = document.getElementById('view-wrapper');
        const focusIndicator = document.getElementById('focus-indicator');
        const outputCanvas = document.getElementById('output-canvas');
        const manualCanvas = document.getElementById('manual-canvas');
        const manualCtx = manualCanvas.getContext('2d');

        const captureBtn = document.getElementById('capture-btn');
        const galleryBtn = document.getElementById('gallery-btn');
        const resetBtn = document.getElementById('reset-btn');
        const mainBtnsRow = document.getElementById('main-btns-row');
        const fileInput = document.getElementById('file-input');

        const contourModeGroup = document.getElementById('contour-mode-group');
        const modeAutoBtn = document.getElementById('mode-auto-btn');
        const modeManualBtn = document.getElementById('mode-manual-btn');
        const thresholdBox = document.getElementById('threshold-box');
        const clearManualBtn = document.getElementById('clear-manual-btn');

        const targetMode = document.getElementById('target-mode');
        const frameSizeInput = document.getElementById('frame-size-input');

        const savePanel = document.getElementById('save-panel');
        const saveRecordBtn = document.getElementById('save-record-btn');
        const sampleNameInput = document.getElementById('sample-name');
        const statusBadge = document.getElementById('status-badge');
        const statusText = document.getElementById('status-text');
        const threshSlider = document.getElementById('thresh-slider');
        const threshVal = document.getElementById('thresh-val');
        const areaDisplay = document.getElementById('area-display');
        const infoDisplay = document.getElementById('info-display');

        const gyroBox = document.getElementById('gyro-box');
        const gyroBubble = document.getElementById('gyro-bubble');
        const gyroLabel = document.getElementById('gyro-label');

        const logTbody = document.getElementById('log-tbody');
        const recordCount = document.getElementById('record-count');
        const exportCsvBtn = document.getElementById('export-csv-btn');
        const exportZipBtn = document.getElementById('export-zip-btn');
        const shareReportBtn = document.getElementById('share-report-btn');
        const clearAllBtn = document.getElementById('clear-all-btn');

        const WARP_SIZE = 500;

        let cvReady = false;
        let isCaptured = false;
        let lastRawMat = null;
        let lastRawCroppedCanvas = null;
        let currentCalculatedArea = "0.00";
        let currentThreshApplied = 110;
        let mediaStream = null;
        let videoTrack = null;
        let focusTimer = null;

        let isManualMode = false;
        let manualPoints = [];
        let isDrawing = false;
        let activePointIndex = -1;
        let warpedBaseCanvas = null;

        let records = JSON.parse(localStorage.getItem('rock_test_records') || '[]');

        function getRealAreaCm2() {
            const sideMm = parseFloat(frameSizeInput.value) || 100.0;
            return (sideMm * sideMm) / 100.0;
        }

        function generateCsvString() {
            let csv = '\uFEFF№;Шифр образца;Площадь (см²);База (мм);Тип;Дата;Время;Порог\n';
            records.forEach((rec, idx) => {
                csv += `${idx + 1};${rec.name};${rec.area};${rec.baseMm};${rec.mode};${rec.date};${rec.time};${rec.threshold}\n`;
            });
            return csv;
        }

        function onOpenCvReady() {
            cvReady = true;
            statusText.textContent = 'Готов к замеру';
            statusBadge.style.color = '#10b981';
            captureBtn.disabled = false;
            galleryBtn.disabled = false;
        }

        if (window.DeviceOrientationEvent) {
            window.addEventListener('deviceorientation', (e) => {
                if (e.beta === null || e.gamma === null) return;
                let x = Math.max(-14, Math.min(14, e.gamma * 0.7));
                let y = Math.max(-14, Math.min(14, e.beta * 0.7));
                gyroBubble.style.transform = `translate(${x}px, ${y}px)`;
                const totalTilt = Math.sqrt(e.beta * e.beta + e.gamma * e.gamma);
                gyroLabel.textContent = `${Math.round(totalTilt)}°`;
                gyroBubble.style.background = totalTilt <= 4 ? '#10b981' : '#f59e0b';
            });
        }

        function stopCamera() {
            if (focusTimer) {
                clearTimeout(focusTimer);
                focusTimer = null;
            }
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
                videoTrack = null;
            }
            video.srcObject = null;
        }

        async function initCamera() {
            stopCamera();
            if (isCaptured) return;

            const configs = [
                {
                    video: {
                        facingMode: { ideal: "environment" },
                        width: { ideal: 1920 },
                        advanced: [{ focusMode: "continuous" }]
                    },
                    audio: false
                },
                { video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 } }, audio: false },
                { video: { facingMode: "environment" }, audio: false },
                { video: true, audio: false }
            ];

            for (let config of configs) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia(config);
                    mediaStream = stream;
                    video.srcObject = stream;
                    await video.play();
                    videoTrack = stream.getVideoTracks()[0];
                    applyContinuousFocus();
                    return;
                } catch (err) {}
            }
        }

        async function applyContinuousFocus() {
            if (!videoTrack) return;
            try {
                const caps = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
                if (caps.focusMode && caps.focusMode.includes('continuous')) {
                    await videoTrack.applyConstraints({
                        advanced: [{ focusMode: 'continuous' }]
                    });
                }
            } catch (e) {}
        }

        viewWrapper.addEventListener('click', async (e) => {
            if (isCaptured || !videoTrack) return;

            const rect = viewWrapper.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            focusIndicator.style.left = clickX + 'px';
            focusIndicator.style.top = clickY + 'px';
            focusIndicator.style.opacity = '1';
            focusIndicator.style.transform = 'translate(-50%, -50%) scale(1)';

            if (focusTimer) clearTimeout(focusTimer);
            focusTimer = setTimeout(() => {
                focusIndicator.style.opacity = '0';
                focusIndicator.style.transform = 'translate(-50%, -50%) scale(0.8)';
            }, 1000);

            try {
                const caps = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
                if (caps.focusMode && caps.focusMode.includes('continuous')) {
                    await videoTrack.applyConstraints({ advanced: [{ focusMode: 'auto' }] });
                    setTimeout(async () => {
                        if (videoTrack) {
                            await videoTrack.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
                        }
                    }, 350);
                }
            } catch (err) {}
        });

        document.addEventListener('pause', stopCamera, false);
        document.addEventListener('resume', () => {
            if (!isCaptured) initCamera();
        }, false);
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                stopCamera();
            } else if (!isCaptured) {
                initCamera();
            }
        });

        threshSlider.oninput = () => {
            threshVal.textContent = threshSlider.value;
            if (isCaptured && lastRawMat && !isManualMode) {
                processFrame(lastRawMat, parseInt(threshSlider.value, 10));
            }
        };

        frameSizeInput.oninput = () => {
            if (isCaptured) {
                if (isManualMode) {
                    calculateManualArea();
                } else if (lastRawMat) {
                    processFrame(lastRawMat, parseInt(threshSlider.value, 10));
                }
            }
        };

        targetMode.onchange = () => {
            if (isCaptured && lastRawMat) processFrame(lastRawMat, null);
        };

        function showResultMode() {
            isCaptured = true;
            video.style.display = 'none';
            outputCanvas.style.display = 'block';
            gyroBox.style.display = 'none';
            mainBtnsRow.style.display = 'none';
            resetBtn.style.display = 'flex';
            savePanel.style.display = 'flex';
            contourModeGroup.style.display = 'grid';
            sampleNameInput.value = `Керн-${records.length + 1}`;
            stopCamera();
        }

        function resetToLiveMode() {
            isCaptured = false;
            outputCanvas.style.display = 'none';
            manualCanvas.style.display = 'none';
            video.style.display = 'block';
            gyroBox.style.display = 'flex';
            mainBtnsRow.style.display = 'grid';
            resetBtn.style.display = 'none';
            savePanel.style.display = 'none';
            contourModeGroup.style.display = 'none';
            clearManualBtn.style.display = 'none';
            thresholdBox.style.display = 'flex';
            isManualMode = false;
            manualPoints = [];
            modeAutoBtn.classList.add('active');
            modeManualBtn.classList.remove('active');
            infoDisplay.textContent = 'Нажмите на область для ручной фокусировки';
            threshVal.textContent = 'Авто';
            fileInput.value = '';
            initCamera();
        }

        // =============================================================
        // РУЧНОЙ РЕЖИМ ЛАССО И РЕДАКТИРОВАНИЯ ТОЧЕК
        // =============================================================
        modeAutoBtn.onclick = () => {
            if (!isManualMode) return;
            isManualMode = false;
            modeAutoBtn.classList.add('active');
            modeManualBtn.classList.remove('active');
            thresholdBox.style.display = 'flex';
            clearManualBtn.style.display = 'none';
            manualCanvas.style.display = 'none';
            if (lastRawMat) processFrame(lastRawMat, parseInt(threshSlider.value, 10));
        };

        modeManualBtn.onclick = () => {
            if (isManualMode) return;
            isManualMode = true;
            modeManualBtn.classList.add('active');
            modeAutoBtn.classList.remove('active');
            thresholdBox.style.display = 'none';
            clearManualBtn.style.display = 'flex';
            manualCanvas.style.display = 'block';

            manualCanvas.width = WARP_SIZE;
            manualCanvas.height = WARP_SIZE;

            infoDisplay.innerHTML = `<span style="color:var(--accent-cyan);">Обведите скол пальцем. Точки можно смещать!</span>`;
            redrawManualCanvas();
        };

        clearManualBtn.onclick = () => {
            manualPoints = [];
            currentCalculatedArea = "0.00";
            areaDisplay.textContent = "0.00";
            redrawManualCanvas();
            infoDisplay.innerHTML = `<span style="color:var(--accent-cyan);">Контур сброшен. Обведите скол заново.</span>`;
        };

        function getCanvasCoordinates(e) {
            const rect = manualCanvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: ((clientX - rect.left) / rect.width) * WARP_SIZE,
                y: ((clientY - rect.top) / rect.height) * WARP_SIZE
            };
        }

        manualCanvas.addEventListener('pointerdown', (e) => {
            if (!isManualMode) return;
            const pt = getCanvasCoordinates(e);

            activePointIndex = -1;
            for (let i = 0; i < manualPoints.length; i++) {
                const dist = Math.hypot(manualPoints[i].x - pt.x, manualPoints[i].y - pt.y);
                if (dist < 24) {
                    activePointIndex = i;
                    break;
                }
            }

            if (activePointIndex === -1) {
                isDrawing = true;
                manualPoints = [pt];
            }
            redrawManualCanvas();
        });

        manualCanvas.addEventListener('pointermove', (e) => {
            if (!isManualMode) return;
            const pt = getCanvasCoordinates(e);

            if (activePointIndex !== -1) {
                manualPoints[activePointIndex] = pt;
                calculateManualArea();
                redrawManualCanvas();
            } else if (isDrawing) {
                const last = manualPoints[manualPoints.length - 1];
                if (!last || Math.hypot(last.x - pt.x, last.y - pt.y) > 8) {
                    manualPoints.push(pt);
                    redrawManualCanvas();
                }
            }
        });

        manualCanvas.addEventListener('pointerup', () => {
            if (!isManualMode) return;
            if (isDrawing) {
                isDrawing = false;
                if (manualPoints.length > 25) {
                    const step = Math.ceil(manualPoints.length / 20);
                    manualPoints = manualPoints.filter((_, idx) => idx % step === 0);
                }
                calculateManualArea();
                redrawManualCanvas();
            }
            activePointIndex = -1;
        });

        function calculateManualArea() {
            if (manualPoints.length < 3) {
                currentCalculatedArea = "0.00";
                areaDisplay.textContent = "0.00";
                return;
            }

            let areaPx = 0;
            const n = manualPoints.length;
            for (let i = 0; i < n; i++) {
                const j = (i + 1) % n;
                areaPx += manualPoints[i].x * manualPoints[j].y;
                areaPx -= manualPoints[j].x * manualPoints[i].y;
            }
            areaPx = Math.abs(areaPx) / 2.0;

            const realAreaCm2 = getRealAreaCm2();
            currentCalculatedArea = ((areaPx / (WARP_SIZE * WARP_SIZE)) * realAreaCm2).toFixed(2);
            areaDisplay.textContent = currentCalculatedArea;
            infoDisplay.innerHTML = `<span style="color:var(--accent-mint);">✓ Ручной замер: S = ${currentCalculatedArea} см²</span>`;
        }

        function redrawManualCanvas() {
            manualCtx.clearRect(0, 0, WARP_SIZE, WARP_SIZE);

            if (warpedBaseCanvas) {
                manualCtx.drawImage(warpedBaseCanvas, 0, 0, WARP_SIZE, WARP_SIZE);
            }

            if (manualPoints.length < 2) return;

            manualCtx.beginPath();
            manualCtx.moveTo(manualPoints[0].x, manualPoints[0].y);
            for (let i = 1; i < manualPoints.length; i++) {
                manualCtx.lineTo(manualPoints[i].x, manualPoints[i].y);
            }
            manualCtx.closePath();
            manualCtx.fillStyle = "rgba(16, 185, 129, 0.42)";
            manualCtx.fill();

            manualCtx.strokeStyle = "#10b981";
            manualCtx.lineWidth = 3;
            manualCtx.stroke();

            if (!isDrawing && manualPoints.length >= 3) {
                manualPoints.forEach((p, idx) => {
                    manualCtx.beginPath();
                    manualCtx.arc(p.x, p.y, 6.5, 0, Math.PI * 2);
                    manualCtx.fillStyle = idx === activePointIndex ? "#38bdf8" : "#ffffff";
                    manualCtx.fill();
                    manualCtx.strokeStyle = "#0f172a";
                    manualCtx.lineWidth = 2;
                    manualCtx.stroke();
                });
            }
        }

        // =============================================================
        // ОБРАБОТКА КАДРА
        // =============================================================
        captureBtn.addEventListener('click', () => {
            if (!cvReady) return;
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = video.videoWidth || 640;
            tempCanvas.height = video.videoHeight || 640;
            tempCanvas.getContext('2d').drawImage(video, 0, 0);

            if (lastRawMat) lastRawMat.delete();
            lastRawMat = cv.imread(tempCanvas);

            showResultMode();
            processFrame(lastRawMat, null);
        });

        galleryBtn.addEventListener('click', () => {
            if (!cvReady) return;
            fileInput.click();
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    const tempCanvas = document.createElement('canvas');
                    tempCanvas.width = img.width;
                    tempCanvas.height = img.height;
                    tempCanvas.getContext('2d').drawImage(img, 0, 0);

                    if (lastRawMat) lastRawMat.delete();
                    lastRawMat = cv.imread(tempCanvas);

                    showResultMode();
                    processFrame(lastRawMat, null);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        resetBtn.addEventListener('click', resetToLiveMode);

        saveRecordBtn.addEventListener('click', () => {
            const name = sampleNameInput.value.trim() || `Образец-${records.length + 1}`;
            const now = new Date();
            const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const dateStr = now.toISOString().slice(0, 10);

            const rawPhotoData = lastRawCroppedCanvas.toDataURL('image/jpeg', 0.85);
            const maskCanvas = isManualMode ? manualCanvas : outputCanvas;
            const maskPhotoData = maskCanvas.toDataURL('image/jpeg', 0.85);

            const record = {
                id: Date.now(),
                name: name,
                area: currentCalculatedArea,
                baseMm: frameSizeInput.value,
                mode: isManualMode ? 'Ручной (Лассо)' : targetMode.value,
                date: dateStr,
                time: timeStr,
                threshold: isManualMode ? 'Ручной' : currentThreshApplied,
                rawImg: rawPhotoData,
                maskImg: maskPhotoData
            };

            records.push(record);
            saveRecordsToStorage();
            renderTable();

            infoDisplay.innerHTML = `<span style="color:var(--accent-mint);">✓ Записан в журнал: ${name}</span>`;
            savePanel.style.display = 'none';
        });

        function saveRecordsToStorage() {
            try {
                localStorage.setItem('rock_test_records', JSON.stringify(records));
            } catch (e) {
                alert('Память переполнена! Экспортируйте архив (ZIP) и очистите журнал.');
            }
        }

        function renderTable() {
            logTbody.innerHTML = '';
            recordCount.textContent = records.length;

            records.forEach((rec, idx) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${idx + 1}</td>
                    <td><b>${rec.name}</b></td>
                    <td style="color:var(--accent-mint); font-weight:700;">${rec.area}</td>
                    <td style="color:var(--text-secondary);">${rec.baseMm} мм</td>
                    <td><button class="btn-red" onclick="deleteRecord(${rec.id})">✕</button></td>
                `;
                logTbody.appendChild(tr);
            });
        }

        window.deleteRecord = function(id) {
            records = records.filter(r => r.id !== id);
            saveRecordsToStorage();
            renderTable();
        };

        clearAllBtn.addEventListener('click', () => {
            if (records.length === 0) return;
            if (confirm('Очистить весь журнал смены?')) {
                records = [];
                saveRecordsToStorage();
                renderTable();
            }
        });

        // =============================================================
        // СОХРАНЕНИЕ В ПАМЯТЬ СМАРТФОНА
        // =============================================================
        function saveBinaryBlobToDevice(blobData, fileName) {
            // Метод 1: Прямой запуск загрузки через нативный DownloadListener Android WebView
            try {
                const blobUrl = URL.createObjectURL(blobData);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = blobUrl;
                a.download = fileName;
                document.body.appendChild(a);
                a.click();
                setTimeout(() => {
                    document.body.removeChild(a);
                    URL.revokeObjectURL(blobUrl);
                }, 1500);
            } catch (e) {}

            // Метод 2: Параллельная прямая запись в общедоступный каталог устройства
            if (window.cordova && cordova.file) {
                const safePath = cordova.file.externalDataDirectory || cordova.file.dataDirectory;
                window.resolveLocalFileSystemURL(safePath, function(dirEntry) {
                    dirEntry.getFile(fileName, { create: true, exclusive: false }, function(fileEntry) {
                        fileEntry.createWriter(function(writer) {
                            writer.onwriteend = function() {
                                alert(`✓ Файл сохранён на устройство:\n${fileName}`);
                            };
                            writer.write(blobData);
                        });
                    });
                }, function() {});
            }
        }

        // 1. Выгрузка CSV
        exportCsvBtn.onclick = function() {
            if (!records || records.length === 0) {
                alert('Журнал смены пуст!');
                return;
            }
            try {
                const csvContent = generateCsvString();
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8' });
                const fileName = `Журнал_испытаний_${new Date().toISOString().slice(0, 10)}.csv`;
                
                saveBinaryBlobToDevice(blob, fileName);
            } catch (err) {
                alert('Ошибка CSV: ' + err.message);
            }
        };

        // 2. Выгрузка ZIP архива
        exportZipBtn.onclick = async function() {
            if (!records || records.length === 0) {
                alert('Журнал смены пуст!');
                return;
            }
            if (typeof JSZip === 'undefined') {
                alert('Библиотека JSZip ещё загружается...');
                return;
            }

            exportZipBtn.style.opacity = '0.5';
            exportZipBtn.style.pointerEvents = 'none';

            try {
                const zip = new JSZip();
                const folderRaw = zip.folder("1_Исходники");
                const folderMasks = zip.folder("2_Контуры_маски");

                records.forEach((rec, idx) => {
                    const prefix = `${idx + 1}_${rec.name}`;
                    const rawBase64 = (rec.rawImg || '').replace(/^data:image\/[a-z]+;base64,/, "");
                    const maskBase64 = (rec.maskImg || '').replace(/^data:image\/[a-z]+;base64,/, "");
                    if (rawBase64) folderRaw.file(`${prefix}_исходник.jpg`, rawBase64, { base64: true });
                    if (maskBase64) folderMasks.file(`${prefix}_маска_${rec.area}см2.jpg`, maskBase64, { base64: true });
                });

                const zipBlob = await zip.generateAsync({ type: "blob" });
                const fileName = `Фотоархив_сколов_${new Date().toISOString().slice(0, 10)}.zip`;

                saveBinaryBlobToDevice(zipBlob, fileName);
            } catch (err) {
                alert('Ошибка архиватора: ' + err.message);
            } finally {
                exportZipBtn.style.opacity = '1';
                exportZipBtn.style.pointerEvents = 'auto';
            }
        };

        // 3. Отдельная кнопка «Поделиться отчётом (CSV)»
        shareReportBtn.onclick = function() {
            if (!records || records.length === 0) {
                alert('Журнал смены пуст!');
                return;
            }

            const csvContent = generateCsvString();
            const fileName = `Журнал_испытаний_${new Date().toISOString().slice(0, 10)}.csv`;

            if (window.plugins && window.plugins.socialsharing && window.cordova && cordova.file) {
                const cacheDir = cordova.file.cacheDirectory || cordova.file.dataDirectory;
                window.resolveLocalFileSystemURL(cacheDir, function(dirEntry) {
                    dirEntry.getFile(fileName, { create: true, exclusive: false }, function(fileEntry) {
                        fileEntry.createWriter(function(writer) {
                            writer.onwriteend = function() {
                                window.plugins.socialsharing.shareWithOptions({
                                    message: `Сводный отчёт: ${fileName}`,
                                    subject: fileName,
                                    files: [fileEntry.nativeURL]
                                }, () => {}, (err) => alert('Ошибка отправки: ' + JSON.stringify(err)));
                            };
                            writer.onerror = (err) => alert('Ошибка подготовки файла: ' + JSON.stringify(err));
                            writer.write(csvContent);
                        });
                    }, (err) => alert('Не удалось создать файл отчета: ' + JSON.stringify(err)));
                }, (err) => alert('Ошибка доступа к кэшу: ' + JSON.stringify(err)));
            } else {
                alert('Функция отправки доступна в установленном приложении.');
            }
        };

        // =============================================================
        // OPENCV АЛГОРИТМЫ
        // =============================================================
        function orderPoints(ptsArr) {
            ptsArr.sort((a, b) => a.y - b.y);
            let topTwo = [ptsArr[0], ptsArr[1]].sort((a, b) => a.x - b.x);
            let botTwo = [ptsArr[2], ptsArr[3]].sort((a, b) => a.x - b.x);
            return [topTwo[0], topTwo[1], botTwo[1], botTwo[0]];
        }

        function findFrameQuad(edged, minArea) {
            let contours = new cv.MatVector();
            let hierarchy = new cv.Mat();
            cv.findContours(edged, contours, hierarchy, cv.RETR_LIST, cv.CHAIN_APPROX_SIMPLE);

            let bestQuad = null;
            let maxArea = 0;

            for (let i = 0; i < contours.size(); i++) {
                let cnt = contours.get(i);
                let peri = cv.arcLength(cnt, true);
                let approx = new cv.Mat();
                cv.approxPolyDP(cnt, approx, 0.02 * peri, true);

                if (approx.rows === 4) {
                    let a = cv.contourArea(approx);
                    if (a > minArea && a > maxArea) {
                        maxArea = a;
                        let pts = [];
                        for (let j = 0; j < 4; j++) {
                            pts.push({ x: approx.data32S[j*2], y: approx.data32S[j*2+1] });
                        }
                        bestQuad = orderPoints(pts);
                    }
                }
                approx.delete();
                cnt.delete();
            }
            hierarchy.delete();
            contours.delete();
            return bestQuad;
        }

        function findFourCornersQuad(grayMat) {
            let bin = new cv.Mat();
            cv.threshold(grayMat, bin, 80, 255, cv.THRESH_BINARY_INV + cv.THRESH_OTSU);

            let contours = new cv.MatVector();
            let hierarchy = new cv.Mat();
            cv.findContours(bin, contours, hierarchy, cv.RETR_LIST, cv.CHAIN_APPROX_SIMPLE);

            let candidates = [];
            for (let i = 0; i < contours.size(); i++) {
                let cnt = contours.get(i);
                let a = cv.contourArea(cnt);
                if (a > 100 && a < 15000) {
                    let rect = cv.boundingRect(cnt);
                    let ratio = rect.width / rect.height;
                    if (ratio > 0.6 && ratio < 1.4) {
                        let m = cv.moments(cnt);
                        if (m.m00 !== 0) {
                            candidates.push({ x: m.m10 / m.m00, y: m.m01 / m.m00 });
                        }
                    }
                }
                cnt.delete();
            }
            bin.delete(); hierarchy.delete(); contours.delete();

            if (candidates.length < 4) return null;

            candidates.sort((a, b) => (a.x + a.y) - (b.x + b.y));
            let topLeft = candidates[0];
            let bottomRight = candidates[candidates.length - 1];

            candidates.sort((a, b) => (a.x - a.y) - (b.x - b.y));
            let bottomLeft = candidates[0];
            let topRight = candidates[candidates.length - 1];

            return orderPoints([topLeft, topRight, bottomRight, bottomLeft]);
        }

        function processFrame(srcMat, manualThreshold) {
            let gray = new cv.Mat(), blur = new cv.Mat(), edged = new cv.Mat();
            cv.cvtColor(srcMat, gray, cv.COLOR_RGBA2GRAY);
            cv.GaussianBlur(gray, blur, new cv.Size(5, 5), 0);
            cv.Canny(blur, edged, 50, 150);

            let quad = null;
            const mode = targetMode.value;

            if (mode === 'frame') {
                quad = findFrameQuad(edged, 12000);
            } else {
                quad = findFourCornersQuad(gray);
            }

            gray.delete(); blur.delete(); edged.delete();

            if (!quad) {
                cv.imshow('output-canvas', srcMat);
                infoDisplay.innerHTML = `<span style="color:var(--accent-red);">${mode === 'frame' ? 'Рамка не найдена!' : '4 маркера не распознаны!'}</span>`;
                areaDisplay.textContent = '0.00';
                return;
            }

            let srcTri = cv.matFromArray(4, 1, cv.CV_32FC2, [
                quad[0].x, quad[0].y,
                quad[1].x, quad[1].y,
                quad[2].x, quad[2].y,
                quad[3].x, quad[3].y
            ]);
            let dstTri = cv.matFromArray(4, 1, cv.CV_32FC2, [0, 0, WARP_SIZE, 0, WARP_SIZE, WARP_SIZE, 0, WARP_SIZE]);
            let M = cv.getPerspectiveTransform(srcTri, dstTri);
            let warped = new cv.Mat();
            cv.warpPerspective(srcMat, warped, M, new cv.Size(WARP_SIZE, WARP_SIZE));

            warpedBaseCanvas = document.createElement('canvas');
            warpedBaseCanvas.width = WARP_SIZE;
            warpedBaseCanvas.height = WARP_SIZE;
            cv.imshow(warpedBaseCanvas, warped);

            let pad = mode === 'frame' ? 25 : 10;
            let roiRect = new cv.Rect(pad, pad, WARP_SIZE - 2*pad, WARP_SIZE - 2*pad);
            let cropped = warped.roi(roiRect);

            lastRawCroppedCanvas = document.createElement('canvas');
            lastRawCroppedCanvas.width = cropped.cols;
            lastRawCroppedCanvas.height = cropped.rows;
            cv.imshow(lastRawCroppedCanvas, cropped);

            let cropGray = new cv.Mat(), cropBlur = new cv.Mat();
            cv.cvtColor(cropped, cropGray, cv.COLOR_RGBA2GRAY);
            cv.GaussianBlur(cropGray, cropBlur, new cv.Size(5, 5), 0);

            let rawMask = new cv.Mat();
            let appliedThresh = manualThreshold;
            if (appliedThresh === null) {
                appliedThresh = Math.round(cv.threshold(cropBlur, rawMask, 0, 255, cv.THRESH_BINARY_INV + cv.THRESH_OTSU));
                threshSlider.value = appliedThresh;
                threshVal.textContent = appliedThresh + ' (Авто)';
            } else {
                cv.threshold(cropBlur, rawMask, appliedThresh, 255, cv.THRESH_BINARY_INV);
                threshVal.textContent = appliedThresh;
            }
            currentThreshApplied = appliedThresh;

            let objContours = new cv.MatVector(), objHierarchy = new cv.Mat();
            cv.findContours(rawMask, objContours, objHierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

            let solidMask = cv.Mat.zeros(cropped.rows, cropped.cols, cv.CV_8U);
            let maxStoneArea = 0, stoneContourIdx = -1;
            for (let i = 0; i < objContours.size(); i++) {
                let a = cv.contourArea(objContours.get(i));
                if (a > maxStoneArea) { maxStoneArea = a; stoneContourIdx = i; }
            }

            if (stoneContourIdx !== -1) {
                cv.drawContours(solidMask, objContours, stoneContourIdx, new cv.Scalar(255), -1);
            }

            let stonePixels = cv.countNonZero(solidMask);
            const realAreaCm2 = getRealAreaCm2();
            currentCalculatedArea = ((stonePixels / (WARP_SIZE * WARP_SIZE)) * realAreaCm2).toFixed(2);

            for (let r = 0; r < cropped.rows; r++) {
                for (let c = 0; c < cropped.cols; c++) {
                    if (solidMask.ucharPtr(r, c)[0] > 0) {
                        let ptr = cropped.ucharPtr(r, c);
                        ptr[0] = 16; ptr[1] = 185; ptr[2] = 129;
                    }
                }
            }

            cv.imshow('output-canvas', warped);
            areaDisplay.textContent = currentCalculatedArea;
            infoDisplay.innerHTML = `<span style="color:var(--accent-mint);">✓ База ${frameSizeInput.value} мм | S = ${currentCalculatedArea} см²</span>`;

            srcTri.delete(); dstTri.delete(); M.delete(); warped.delete();
            cropped.delete(); cropGray.delete(); cropBlur.delete();
            rawMask.delete(); objContours.delete(); objHierarchy.delete(); solidMask.delete();
        }

        renderTable();

        function startAppWithPermissions() {
            if (window.cordova && cordova.plugins && cordova.plugins.permissions) {
                const permissions = cordova.plugins.permissions;
                const permissionsList = [
                    permissions.CAMERA,
                    permissions.WRITE_EXTERNAL_STORAGE,
                    permissions.READ_EXTERNAL_STORAGE
                ];

                permissions.requestPermissions(permissionsList, function(status) {
                    initCamera();
                }, function() {
                    initCamera();
                });
            } else {
                initCamera();
            }
        }

        if (window.cordova) {
            document.addEventListener('deviceready', startAppWithPermissions, false);
        } else {
            document.addEventListener('DOMContentLoaded', startAppWithPermissions);
        }
    </script>
