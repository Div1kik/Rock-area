<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Лабораторный планиметр керна</title>
    <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="onOpenCvReady();" type="text/javascript"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background: #121212; color: #fff; display: flex; flex-direction: column; align-items: center; padding: 12px; }
        h1 { font-size: 1.1rem; margin-bottom: 6px; font-weight: 500; }

        .view-container {
            position: relative;
            width: 320px;
            height: 320px;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }

        video, canvas { width: 100%; height: 100%; object-fit: cover; }

        .status-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            background: rgba(0,0,0,0.7);
            color: #ff9500;
            z-index: 10;
        }

        .gyro-widget {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: rgba(20, 20, 20, 0.75);
            border: 1.5px solid rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        .gyro-target { position: absolute; width: 12px; height: 12px; border-radius: 50%; border: 1px dashed rgba(255,255,255,0.5); }
        .gyro-bubble { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: #ff9500; box-shadow: 0 0 5px #ff9500; transition: transform 0.05s linear; }
        .gyro-label { position: absolute; bottom: -15px; font-size: 9px; color: #aaa; }

        .controls { width: 320px; margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }

        .btn-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .btn {
            background: #007aff;
            color: white;
            border: none;
            padding: 12px;
            font-size: 14px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }
        .btn:disabled { background: #444; color: #888; }
        .btn-secondary { background: #2c2c2e; border: 1px solid #444; }
        .btn-green { background: #34c759; }
        .btn-outline { background: transparent; border: 1px solid #555; color: #ddd; padding: 8px; font-size: 13px; }
