name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-33 build-tools;33.0.2'

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Cordova
        run: npm install -g cordova

      - name: Prepare Offline Assets and Build Project
        run: |
          cordova create app com.div1kik.rockarea "RockArea"
          cd app
          rm -rf www/*
          
          # Копируем только файлы приложения (без .git и workflows)
          cp ../index.html www/index.html
          mkdir -p www/js
          
          # Скачиваем библиотеки в локальную папку
          curl -sL https://docs.opencv.org/4.8.0/opencv.js -o www/js/opencv.js
          curl -sL https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js -o www/js/jszip.min.js
          
          # Подменяем пути скриптов на локальные
          sed -i 's|https://docs.opencv.org/4.8.0/opencv.js|js/opencv.js|g' www/index.html
          sed -i 's|https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js|js/jszip.min.js|g' www/index.html
          
          # Настраиваем платформу с точной версией под SDK 33
          cordova platform add android@12.0.1
          
          # Запуск сборки APK
          cordova build android --debug -- --gradleArg=--no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RockArea-Offline-App
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
