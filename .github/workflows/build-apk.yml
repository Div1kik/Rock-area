name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Cordova
        run: npm install -g cordova

      - name: Build Cordova Project
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

          cordova create app com.div1kik.rockarea "RockArea"
          cd app
          rm -rf www/*

          cp ../index.html www/index.html
          mkdir -p www/js

          curl -sL https://docs.opencv.org/4.8.0/opencv.js -o www/js/opencv.js
          curl -sL https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js -o www/js/jszip.min.js

          sed -i 's|https://docs.opencv.org/4.8.0/opencv.js|js/opencv.js|g' www/index.html
          sed -i 's|https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js|js/jszip.min.js|g' www/index.html

          # Плагины камеры, файловой системы и системного диалога выгрузки
          cordova plugin add cordova-plugin-camera
          cordova plugin add cordova-plugin-android-permissions
          cordova plugin add cordova-plugin-file
          cordova plugin add es6-promise-plugin
          cordova plugin add cordova-plugin-x-socialsharing

          cordova platform add android

          MANIFEST="platforms/android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i '/<application/i <uses-permission android:name="android.permission.CAMERA" />' "$MANIFEST"
            sed -i '/<application/i <uses-feature android:name="android.hardware.camera" android:required="true" />' "$MANIFEST"
            sed -i '/<application/i <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />' "$MANIFEST"
            sed -i '/<application/i <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />' "$MANIFEST"
            sed -i '/<application/i <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />' "$MANIFEST"
            sed -i 's/<application /<application android:requestLegacyExternalStorage="true" /g' "$MANIFEST"
          fi

          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RockArea-Offline-App
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
