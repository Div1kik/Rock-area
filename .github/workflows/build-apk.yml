name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Cordova
        run: npm install -g cordova

      - name: Build Cordova Project
        run: |
          # Автоматически принимаем лицензии для встроенного Android SDK
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

          # Создаем каркас приложения
          cordova create app com.div1kik.rockarea "RockArea"
          cd app
          rm -rf www/*

          # Копируем веб-файл
          cp ../index.html www/index.html
          mkdir -p www/js

          # Скачиваем библиотеки внутрь пакета
          curl -sL https://docs.opencv.org/4.8.0/opencv.js -o www/js/opencv.js
          curl -sL https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js -o www/js/jszip.min.js

          # Локализуем пути в index.html
          sed -i 's|https://docs.opencv.org/4.8.0/opencv.js|js/opencv.js|g' www/index.html
          sed -i 's|https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js|js/jszip.min.js|g' www/index.html

          # Подключаем Android платформу
          cordova platform add android

          # Запускаем компиляцию
          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RockArea-Offline-App
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
